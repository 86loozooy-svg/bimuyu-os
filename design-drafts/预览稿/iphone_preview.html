<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 移动端预览 — Studio OS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 32px 16px 48px;
    background: radial-gradient(circle at 50% 0%, #2a2d38 0%, #14151c 45%, #0a0b0f 100%);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Inter", sans-serif;
    color: #f2f4f8;
  }
  .hint { font-size: 13px; color: #9aa0ae; text-align: center; max-width: 420px; line-height: 1.6; }
  .switch { display: flex; gap: 10px; }
  .switch button {
    border: 1px solid rgba(182,255,60,.35);
    background: rgba(182,255,60,.08);
    color: #b6ff3c;
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s ease;
  }
  .switch button.active { background: #b6ff3c; color: #0a0b0f; font-weight: 600; }
  .switch button:hover { transform: translateY(-1px); }

  /* ---- iPhone 14 Pro 外壳 ---- */
  .device {
    position: relative;
    width: 393px;
    height: 852px;
    background: #000;
    border-radius: 55px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #2a2d38,
      0 30px 80px rgba(0,0,0,.6),
      inset 0 0 2px 2px rgba(255,255,255,.06);
  }
  .screen {
    position: relative;
    width: 369px;
    height: 828px;
    border-radius: 44px;
    overflow: hidden;
    background: #0a0b0f;
    /* 为状态栏/灵动岛让出顶部安全区：iframe 整体下移，网站 header 不再被岛遮挡 */
    padding-top: 54px;
  }
  .screen iframe {
    width: 369px;
    height: 774px;   /* 828 - 54 状态栏安全区 */
    border: 0;
    background: #0a0b0f;
    display: block;
  }
  /* 灵动岛 */
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
    pointer-events: none;
  }
  /* 状态栏（半透明叠在顶部，不挡操作） */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    z-index: 15;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  /* 侧边按钮 */
  .btn-side { position: absolute; background: #1c1c1e; border-radius: 3px; z-index: 5; }
  .btn-side.power { right: -3px; top: 200px; width: 3px; height: 96px; }
  .btn-side.vol-up { left: -3px; top: 180px; width: 3px; height: 64px; }
  .btn-side.vol-dn { left: -3px; top: 256px; width: 3px; height: 64px; }
  .btn-side.mute { left: -3px; top: 120px; width: 3px; height: 40px; }
</style>
</head>
<body>
  <div class="switch">
    <button id="btn-home" class="active" onclick="go('home')">公开站首页</button>
    <button id="btn-login" onclick="go('login')">登录页</button>
  </div>
  <p class="hint">iPhone 14 Pro 模拟（390×844 逻辑像素）。下方为真实网站在移动端视口下的渲染，可滚动查看。若 iframe 空白，请确认本机 127.0.0.1:8013 服务已启动。</p>

  <div class="device">
    <div class="btn-side mute"></div>
    <div class="btn-side vol-up"></div>
    <div class="btn-side vol-dn"></div>
    <div class="btn-side power"></div>
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="right">●●●︎ &nbsp; Wi-Fi &nbsp; ▮▮▮ 100%</span>
      </div>
      <iframe id="frame" src="http://127.0.0.1:8013/"></iframe>
    </div>
  </div>

  <script>
    function go(page) {
      var url = page === 'login' ? 'http://127.0.0.1:8013/app/login' : 'http://127.0.0.1:8013/';
      document.getElementById('frame').src = url;
      document.getElementById('btn-home').classList.toggle('active', page === 'home');
      document.getElementById('btn-login').classList.toggle('active', page === 'login');
    }
  </script>
</body>
</html>
