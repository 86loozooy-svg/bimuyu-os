<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Studio OS{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="brand">Studio OS</div>
      <ul class="app-nav">
        <li><a href="/app/" {% if request.url.path == '/app/' %}class="active"{% endif %}>Dashboard</a></li>
        <li><a href="/app/pipeline" {% if '/pipeline' in request.url.path %}class="active"{% endif %}>线索看板</a></li>
        <li><a href="/app/projects" {% if '/projects' in request.url.path %}class="active"{% endif %}>项目</a></li>
        <li><a href="/app/library" {% if '/library' in request.url.path %}class="active"{% endif %}>资料库</a></li>
        <li><a href="/app/quotes" {% if '/quotes' in request.url.path %}class="active"{% endif %}>报价中心</a></li>
        {% if user and user.role == 'admin' %}
        <li><a href="/app/settings" {% if '/settings' in request.url.path %}class="active"{% endif %}>设置</a></li>
        {% endif %}
        <li style="margin-top:24px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px">
          <a href="/" target="_blank">查看公开站 ↗</a>
        </li>
        <li><a href="/app/logout">退出登录</a></li>
      </ul>
    </aside>
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
