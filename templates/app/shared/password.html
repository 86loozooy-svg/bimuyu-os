<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>需要密码 · 只读分享</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/halo.css">
  <style>
    .pw-page { max-width: 380px; margin: 12vh auto 0; padding: 0 20px; }
    .pw-card { padding: 28px; }
    .pw-card h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .pw-card p { color: var(--color-text-secondary); font-size: .875rem; margin: 0 0 18px; }
    .pw-card input { width: 100%; padding: 11px 12px; background: var(--color-background); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: var(--radius-sm); margin-bottom: 14px; }
    .pw-err { color: var(--color-error); font-size: .8125rem; margin-bottom: 12px; }
  </style>
</head>
<body style="background:var(--color-background);min-height:100vh">
  <div class="pw-page">
    <div class="card pw-card">
      <h2>该分享需要密码</h2>
      <p>请输入创建者设置的访问密码以查看只读内容。</p>
      {% if error %}<div class="pw-err">{{ error }}</div>{% endif %}
      <form method="post" action="/share/{{ token }}">
        <input type="password" name="password" placeholder="访问密码" autofocus>
        <button type="submit" class="btn btn-primary" style="width:100%">查看</button>
      </form>
    </div>
  </div>
</body>
</html>
