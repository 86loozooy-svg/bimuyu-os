{% extends "public/base.html" %}
{% block title %}{{ case.title }} — Studio OS{% endblock %}
{% block content %}
<article class="case-detail">
  <div class="container">
    <h1>{{ case.title }}</h1>
    <p class="case-meta">{{ case.subtitle }}</p>
    <p class="case-summary">{{ case.description }}</p>

    <div class="case-gallery">
      {% for img in images %}
      <img src="{{ img.image_path }}" alt="{{ img.caption or case.title }}" class="detail-img">
      {% endfor %}
    </div>

    <a href="/cases" class="btn">返回案例</a>
  </div>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var imgs = document.querySelectorAll('.case-gallery .detail-img');
    if (!('IntersectionObserver' in window)) {
      imgs.forEach(function (img) { img.classList.add('visible'); });
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    imgs.forEach(function (img) { observer.observe(img); });
  });
</script>
{% endblock %}
